server {
    listen 8090;
    server_name _;
    root /data;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    location /dash/ {
        limit_except GET { deny all; }
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
