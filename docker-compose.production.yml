services:
  postgres:
    image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-videosim}"
      POSTGRES_USER: "${POSTGRES_USER:-videosim}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set a strong PostgreSQL password}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-role-init:
    image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-videosim}"
      PGUSER: "${POSTGRES_USER:-videosim}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?set a strong PostgreSQL owner password}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?set a distinct URL-safe PostgreSQL application password}"
      POSTGRES_PUBLISHER_PASSWORD: "${POSTGRES_PUBLISHER_PASSWORD:?set a distinct URL-safe PostgreSQL publisher password}"
      POSTGRES_PRUNER_PASSWORD: "${POSTGRES_PRUNER_PASSWORD:?set a distinct URL-safe PostgreSQL pruner password}"
    volumes:
      - ./scripts/postgres-runtime-role.sh:/scripts/postgres-runtime-role.sh:ro
    command: ["/scripts/postgres-runtime-role.sh"]
    restart: "no"

  nats:
    image: nats:2.11-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    command: ["-js", "-sd", "/data", "--user", "${NATS_USER:-videosim}", "--pass", "${NATS_PASSWORD:?set a strong NATS password}"]
    volumes:
      - nats-data:/data
    restart: unless-stopped

  migrate:
    build: .
    depends_on:
      postgres-role-init:
        condition: service_completed_successfully
    environment:
      VIDEOSIM_DATABASE_URL: "postgresql://${POSTGRES_USER:-videosim}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-videosim}"
    command: python -m videosim migrate
    restart: "no"

  postgres-role-grants:
    image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-videosim}"
      PGUSER: "${POSTGRES_USER:-videosim}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?set a strong PostgreSQL owner password}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?set a distinct URL-safe PostgreSQL application password}"
      POSTGRES_PUBLISHER_PASSWORD: "${POSTGRES_PUBLISHER_PASSWORD:?set a distinct URL-safe PostgreSQL publisher password}"
      POSTGRES_PRUNER_PASSWORD: "${POSTGRES_PRUNER_PASSWORD:?set a distinct URL-safe PostgreSQL pruner password}"
    volumes:
      - ./scripts/postgres-runtime-role.sh:/scripts/postgres-runtime-role.sh:ro
    command: ["/scripts/postgres-runtime-role.sh", "grant"]
    restart: "no"

  nats-init:
    build: .
    depends_on:
      nats:
        condition: service_started
    command: python -m videosim nats-init --nats-url "nats://${NATS_USER:-videosim}:${NATS_PASSWORD}@nats:4222"
    restart: on-failure

  app:
    build: .
    environment:
      VIDEOSIM_VERBOSE: "1"
      VIDEOSIM_MONITOR_STATE: /var/lib/videosim/monitor/state.json
      VIDEOSIM_DATABASE_URL: "postgresql://videosim_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-videosim}"
      VIDEOSIM_DB_POOL_MIN: "${VIDEOSIM_DB_POOL_MIN:-1}"
      VIDEOSIM_DB_POOL_MAX: "${VIDEOSIM_DB_POOL_MAX:-10}"
      VIDEOSIM_ALARM_REPEAT_SECONDS: "${VIDEOSIM_ALARM_REPEAT_SECONDS:-5}"
      VIDEOSIM_ALARM_EVENT_HISTORY_LIMIT: "${VIDEOSIM_ALARM_EVENT_HISTORY_LIMIT:-1000}"
      VIDEOSIM_ALARM_EVENT_RETENTION_SECONDS: "${VIDEOSIM_ALARM_EVENT_RETENTION_SECONDS:-604800}"
      VIDEOSIM_SECURITY_MODE: trusted-proxy
      VIDEOSIM_PROXY_SHARED_SECRET: "${VIDEOSIM_PROXY_SHARED_SECRET:?set a 32+ character proxy secret}"
      VIDEOSIM_VIEWER_GROUP: "${VIDEOSIM_VIEWER_GROUP:-videosim-viewer}"
      VIDEOSIM_ADMIN_GROUP: "${VIDEOSIM_ADMIN_GROUP:-videosim-admin}"
      VIDEOSIM_ALLOW_PRIVATE_FEEDS: "${VIDEOSIM_ALLOW_PRIVATE_FEEDS:-0}"
      VIDEOSIM_ALLOWED_FEED_HOST_SUFFIXES: "${VIDEOSIM_ALLOWED_FEED_HOST_SUFFIXES:-}"
    depends_on:
      postgres-role-grants:
        condition: service_completed_successfully
    expose:
      - "8080"
    volumes:
      - app-data:/var/lib/videosim
      - dash-data:/tmp/videosim-dash
    command: >
      python -m videosim gui --host 0.0.0.0 --http-port 8080 --feed-port 9000
      --worker-base-url https://proxy:9443
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  outbox-publisher:
    build: .
    depends_on:
      postgres-role-grants:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
    environment:
      VIDEOSIM_DATABASE_URL: "postgresql://videosim_publisher:${POSTGRES_PUBLISHER_PASSWORD}@postgres:5432/${POSTGRES_DB:-videosim}"
    command: >
      python -m videosim outbox-publisher
      --nats-url "nats://${NATS_USER:-videosim}:${NATS_PASSWORD}@nats:4222"
      --batch-size 100
    restart: unless-stopped

  monitor-history-pruner:
    build: .
    depends_on:
      postgres-role-grants:
        condition: service_completed_successfully
    environment:
      VIDEOSIM_DATABASE_URL: "postgresql://videosim_pruner:${POSTGRES_PRUNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-videosim}"
      VIDEOSIM_ALARM_EVENT_RETENTION_SECONDS: "${VIDEOSIM_ALARM_EVENT_RETENTION_SECONDS:-604800}"
    command: >
      python -m videosim monitor-history-prune
      --poll-interval-seconds "${VIDEOSIM_MONITOR_HISTORY_PRUNE_INTERVAL_SECONDS:-3600}"
      --batch-size 1000
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:?set the OIDC issuer URL}"
      OAUTH2_PROXY_CLIENT_ID: "${OIDC_CLIENT_ID:?set the OIDC client ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?set the OIDC client secret}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OIDC_COOKIE_SECRET:?set a 32-byte base64 cookie secret}"
      OAUTH2_PROXY_REDIRECT_URL: "${VIDEOSIM_OPERATOR_URL:-https://localhost:8443}/oauth2/callback"
      OAUTH2_PROXY_EMAIL_DOMAINS: "${OIDC_EMAIL_DOMAINS:-*}"
      OAUTH2_PROXY_SCOPE: "openid profile email groups"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
    expose:
      - "4180"
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
      oauth2-proxy:
        condition: service_started
    environment:
      NGINX_ENVSUBST_FILTER: ^VIDEOSIM_PROXY_SHARED_SECRET$
      VIDEOSIM_PROXY_SHARED_SECRET: "${VIDEOSIM_PROXY_SHARED_SECRET:?set a 32+ character proxy secret}"
    ports:
      - "${VIDEOSIM_OPERATOR_PORT:-8443}:8443"
      - "${VIDEOSIM_WORKER_PORT:-9443}:9443"
    volumes:
      - ./deploy/nginx/videosim.conf.template:/etc/nginx/templates/videosim.conf.template:ro
      - ./deploy/certs:/etc/videosim/certs:ro
    restart: unless-stopped

  worker:
    build: .
    depends_on:
      proxy:
        condition: service_started
    volumes:
      - ./deploy/certs:/etc/videosim/certs:ro
    command: >
      python -m videosim worker
      --control-plane-url https://proxy:9443
      --worker-id worker-1
      --srt-host app
      --heartbeat-interval-seconds 20
      --tls-ca-file /etc/videosim/certs/server-ca.crt
      --tls-cert-file /etc/videosim/certs/worker-1.crt
      --tls-key-file /etc/videosim/certs/worker-1.key
    restart: unless-stopped

volumes:
  app-data:
  dash-data:
  postgres-data:
  nats-data:
