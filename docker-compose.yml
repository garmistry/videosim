services:
  app:
    build: .
    environment:
      VIDEOSIM_VERBOSE: "${VIDEOSIM_VERBOSE:-1}"
      VIDEOSIM_MONITOR_STATE: /tmp/videosim-monitor/state.json
    ports:
      - "${VIDEOSIM_HTTP_PORT:-8080}:8080"
      - "${VIDEOSIM_FEED_PORT:-9000}:${VIDEOSIM_FEED_PORT:-9000}/udp"
      - "${VIDEOSIM_FEED_PORT_RANGE:-9001-9010}:${VIDEOSIM_FEED_PORT_RANGE:-9001-9010}/udp"
    volumes:
      - monitor-state:/tmp/videosim-monitor
      - dash-data:/tmp/videosim-dash
    command: python -m videosim gui --host 0.0.0.0 --http-port 8080 --feed-port ${VIDEOSIM_FEED_PORT:-9000}
  monitor:
    build: .
    depends_on:
      - app
    volumes:
      - monitor-state:/tmp/videosim-monitor
      - dash-data:/tmp/videosim-dash
    command: >
      python -m videosim monitor --gui-state-url http://app:8080/state.json
      --state-path /tmp/videosim-monitor/state.json
      --srt-host app
      --poll-interval-seconds 5
      --repeat-interval-seconds 5
  worker:
    build: .
    depends_on:
      - app
    command: >
      python -m videosim worker --control-plane-url http://app:8080
      --worker-id worker-1
      --srt-host app
      --poll-interval-seconds 5
      --repeat-interval-seconds 5
  test:
    build: .
    command: python -m unittest discover -s tests
  live-srt:
    build: .
    environment:
      VIDEOSIM_LIVE_SRT: "1"
    command: python -m unittest tests.test_live_srt
  monitor-fixtures:
    build: .
    command: python -m unittest tests.test_monitor tests.test_tr101
  m12-soak:
    build: .
    environment:
      REPORT_DIR: /app/reports/m12-soak
      NORMAL_DURATION_SECONDS: ${NORMAL_DURATION_SECONDS:-86400}
      OUTAGE_DURATION_SECONDS: ${OUTAGE_DURATION_SECONDS:-3600}
      VALIDATION_INTERVAL_SECONDS: ${VALIDATION_INTERVAL_SECONDS:-900}
      STARTUP_SECONDS: ${STARTUP_SECONDS:-4}
    volumes:
      - ./reports:/app/reports
    command: bash scripts/run-m12-soak.sh
  m12-gui-soak:
    build: .
    environment:
      GUI_DURATION_SECONDS: ${GUI_DURATION_SECONDS:-86400}
      GUI_VALIDATION_INTERVAL_SECONDS: ${GUI_VALIDATION_INTERVAL_SECONDS:-900}
      GUI_POLL_INTERVAL_SECONDS: ${GUI_POLL_INTERVAL_SECONDS:-30}
    volumes:
      - ./reports:/app/reports
    command: >
      bash -lc 'python -m videosim gui-soak --http-port 9200 --feed-port 9201
      --width 320 --height 180 --framerate 10
      --duration-seconds "$${GUI_DURATION_SECONDS}"
      --validation-interval-seconds "$${GUI_VALIDATION_INTERVAL_SECONDS}"
      --poll-interval-seconds "$${GUI_POLL_INTERVAL_SECONDS}"
      --json | tee /app/reports/m12-gui-soak.json'

volumes:
  monitor-state:
  dash-data:
